[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-claude-code"
version = "1.0.0"
description = "Orchestrateur multi-agents Claude & TypeSafe Jev (Zero crédit Claude API)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Girardot Nicolas", email = "nicolas.girardot@etu.umontpellier.fr" }
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
workflow = "cli:main"
workflow-claude = "cli:main"

[tool.setuptools.packages.find]
include = ["clients*", "ui*"]
exclude = ["output*", "tests*"]

[tool.setuptools]
py-modules = ["cli", "config", "models", "orchestrator"]
