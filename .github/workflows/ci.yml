name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    # pas de filtre de branche : les PR empilées (base ≠ main) sont aussi testées
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Ruff check
        run: ruff check .

  test:
    name: Tests (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Show tool versions
        run: |
          git --version
          python --version

      - name: Configure Git for tests
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@workflow-claude.local"

      - name: Run unit test suite
        run: |
          python -m unittest discover -s tests -v

  package:
    name: Package smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package (non editable)
        run: python -m pip install .

      - name: Run the installed CLI outside the checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          workflow --version
          python -m workflow_claude --version
          workflow --mock --standalone "smoke test"

      - name: Install with pipx and run (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install pipx
          pipx install --force .
          cd "$RUNNER_TEMP"
          "$HOME/.local/bin/workflow" --version
          "$HOME/.local/bin/workflow" --mock --standalone "pipx smoke test"

  coverage:
    name: Coverage (threshold from pyproject.toml)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Configure Git for tests
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@workflow-claude.local"

      - name: Run tests with coverage
        run: |
          coverage run -m unittest discover -s tests
          coverage report
